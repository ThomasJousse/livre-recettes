<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livre de recettes</title>
<meta name="theme-color" content="#1F5FA8">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<style>
/* Direction : batterie de cuisine émaillée — blanc émail, bleu cobalt de cocotte, moutarde en rappel.
   Layout : colonne unique mobile d'abord, barre d'onglets en bas, grille de fiches au-delà de 600px. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --ink:#16212B; --muted:#5B6873; --line:#D9DFDB;
  --accent:#1F5FA8; --accent-ink:#FFFFFF; --accent-soft:#E2ECF7;
  --mustard:#C9921A; --mustard-soft:#F7EDD3;
  --ok:#3E7A4A; --ok-soft:#E1EFE3; --cold:#2C7FA3; --cold-soft:#DEEFF6;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", Roboto, sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F151B; --surface:#18212A; --ink:#E7ECEF; --muted:#97A4AE; --line:#2A3641;
    --accent:#6EA6E6; --accent-ink:#0B1622; --accent-soft:#1C3047;
    --mustard:#E4B54A; --mustard-soft:#3A3020;
    --ok:#7DBB86; --ok-soft:#1F3324; --cold:#6CC0E0; --cold-soft:#173340;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#18212A; --ink:#E7ECEF; --muted:#97A4AE; --line:#2A3641;
  --accent:#6EA6E6; --accent-ink:#0B1622; --accent-soft:#1C3047;
  --mustard:#E4B54A; --mustard-soft:#3A3020;
  --ok:#7DBB86; --ok-soft:#1F3324; --cold:#6CC0E0; --cold-soft:#173340;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-top:env(safe-area-inset-top);padding-bottom:calc(76px + env(safe-area-inset-bottom));
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
button,a,select,.item,.ings li{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){.btn:active,.chip:active,.stp button:active{transform:scale(.96)}}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:780px;margin:0 auto;padding:18px 16px 28px;display:flex;flex-direction:column;gap:18px}
.mut{color:var(--muted)}
.small{font-size:.86rem}

/* En-tête */
.hero{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.hero h1{font-size:1.6rem}
.kicker{font:700 .78rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}

/* Recherche + filtres */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 28px 2px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 32px),transparent)}
.chips::-webkit-scrollbar{display:none}
.tools{display:flex;align-items:center;gap:8px;margin-top:-6px}
.tri{font:inherit;font-size:.86rem;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:60vw}
.chip{flex:none;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.9rem}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Fiches */
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.card-top{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:12px 14px 6px;text-decoration:none;border-left:6px solid hsl(var(--h) 62% 48%)}
.card-top .no{grid-row:span 3;font-size:1.7rem;line-height:1;padding-top:2px;min-width:1.2em;text-align:center}
.cty{font:700 .72rem/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--h) 55% 42%)}
.grp{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin:10px 0 -2px;font-size:1.1rem}
.grp:first-child{margin-top:0}
.grp small{font:600 .82rem var(--body);color:var(--muted)}
.card-top p{margin:0;font-size:.9rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{display:flex;align-items:center;gap:6px;padding:6px 14px 10px;flex-wrap:wrap}
.card-foot .btn{padding:6px 12px}
.pill{font-size:.78rem;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.pill.b{background:var(--mustard-soft);color:var(--ink)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.ghost{background:transparent}
a.btn{text-decoration:none}
.src{display:flex;align-items:flex-start;gap:8px;font-size:.86rem;color:var(--muted);margin:2px 0 0}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:.5em}
.src.ok .dot{background:var(--ok)}
.src.err{color:var(--ink)}
.src.err .dot{background:var(--mustard)}
.src .btn{padding:3px 10px;font-size:.8rem;margin:2px 0 2px 4px;vertical-align:middle}
.foot{font-size:.88rem;color:var(--muted);text-align:center;padding:4px 10px}

/* Fiche recette */
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:var(--accent);font-weight:700}
.rhead{display:flex;flex-direction:column;gap:8px;border-left:6px solid hsl(var(--h) 62% 48%);padding-left:14px}
.rhead .no{font:800 1rem/1 var(--display);color:hsl(var(--h) 55% 45%);letter-spacing:.02em}
.rhead p{margin:0;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.facts b{font:700 1rem/1.2 var(--display)}
.facts div:last-child{grid-column:span 2}
@media (min-width:600px){.facts{grid-template-columns:repeat(5,1fr)}.facts div:last-child{grid-column:auto}}
.facts span{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ings li{display:grid;grid-template-columns:28px 92px 1fr;gap:8px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.ings li:first-child{border-top:0}
.ings li[data-act]{cursor:pointer}
.ings .q{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.ings .nm small{display:block;color:var(--muted);font-size:.84rem}
.ings li.got .q,.ings li.got .nm{opacity:.4;text-decoration:line-through}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);padding:0;display:inline-grid;place-items:center;align-self:center}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.box.on::after{content:"✓";font-size:14px;font-weight:700;line-height:1}
.acc{margin:0;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:.92rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:10px;counter-increment:s}
.steps li::before{content:counter(s);font:800 1.35rem/1 var(--display);color:var(--accent);padding-top:2px}
.steps p{margin:0}
.tok{display:inline-block;padding:0 7px;border-radius:6px;background:var(--accent-soft);font-weight:700;white-space:nowrap}
.tmr{margin-top:6px;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:4px 11px;font-size:.86rem;font-weight:700}
.tip{background:var(--mustard-soft);border-radius:var(--r);padding:14px 16px;font-size:.95rem}
.tip b{font-family:var(--display)}

/* Stepper */
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.stp button{width:38px;height:38px;border:0;background:transparent;font-size:1.25rem;font-weight:700;color:var(--accent);border-radius:999px}
.stp button:disabled{opacity:.3}
.stp output{min-width:46px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.field label{display:flex;flex-direction:column}
.field label small{color:var(--muted);font-size:.82rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:700;font-size:.92rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.ver{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.ver::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--accent);transition:transform .22s ease}
.ver.auth::before{transform:translateX(100%)}
@media (prefers-reduced-motion:reduce){.ver::before{transition:none}}
.ver button{position:relative;z-index:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:700;font-size:.95rem;color:var(--muted)}
.ver button[aria-checked="true"]{color:var(--accent-ink)}
.sum{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
.sum b{font:800 1.5rem/1 var(--display);font-variant-numeric:tabular-nums}

/* Menu */
.menu{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.menu li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.menu li:first-child{border-top:0}
.menu .t{flex:1;min-width:0}
.menu .t a{font-weight:700;text-decoration:none}
.menu .t small{display:block;color:var(--muted)}
.x{border:0;background:transparent;color:var(--muted);font-size:1.2rem;width:32px;height:32px;border-radius:8px}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.over i{background:var(--mustard)}
.note{font-size:.9rem;padding:10px 12px;border-radius:10px}
.note.cold{background:var(--cold-soft)}
.note.warn{background:var(--mustard-soft)}

/* Plan */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan li{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start}
.plan .d{font:700 .84rem/1.3 var(--display);color:var(--accent);padding-top:2px}
.plan small{display:block;color:var(--muted)}
.eve{display:block;font-size:.84rem;font-weight:700}
.frz{color:var(--cold);font-size:.84rem;font-weight:700}

/* Liste de courses */
.ray h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:6px 0 2px}
.items{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:30px 1fr auto;gap:2px 10px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
.item[data-act]{cursor:pointer}
.item .nm{font-weight:700}
.item .pr{color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.item .bq{color:var(--accent);font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.item .bq.mut{color:var(--muted)}
.item .sub{grid-column:2 / 4;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.item.done .nm,.item.done .bq,.item.done .pr{opacity:.4;text-decoration:line-through}
.item.done .sub{opacity:.5}
.have{border:0;background:var(--bg);border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted);font-weight:700}
details.stock summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0}
.empty{padding:22px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Onglets */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding-bottom:env(safe-area-inset-bottom);z-index:20}
#tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;text-decoration:none;font-weight:700;font-size:.86rem;color:var(--muted)}
#tabs a.on{color:var(--accent)}
#tabs svg{width:22px;height:22px}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;margin-left:4px}

/* Minuteurs */
#timers{position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:6px;padding:0 12px}
#timers:not(:empty){padding:8px 12px;background:var(--bg)}
.timer{display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 12px;max-width:780px;margin:0 auto;width:100%}
.timer b{font:800 1.3rem/1 var(--display);font-variant-numeric:tabular-nums}
.timer span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.timer.done{background:var(--mustard);color:#1a1300;animation:pulse 1s infinite}
.timer button{border:0;background:transparent;color:inherit;font-size:1.1rem}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.timer.done{animation:none}}

/* Mode cuisine */
#cook{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#cook[hidden]{display:none}
#ck-timers{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
#ck-timers:empty{display:none}
.ck-top{display:flex;align-items:center;gap:10px}
.ck-top h2{flex:1;font-size:1.05rem}
.ck-prog{display:flex;gap:4px;margin:12px 0}
.ck-prog i{flex:1;height:5px;border-radius:999px;background:var(--line)}
.ck-prog i.on{background:var(--accent)}
.ck-body{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;max-width:680px;margin:0 auto;width:100%}
.ck-n{font:800 1rem/1 var(--display);color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.ck-t{font-size:1.45rem;line-height:1.45}
.ck-nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:680px;margin:12px auto 0;width:100%}
.ck-nav .btn{justify-content:center;padding:14px;font-size:1rem;border-radius:14px}
details.ck-ing summary{cursor:pointer;font-weight:700;color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:.92rem;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
textarea.copy{width:100%;min-height:180px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);padding:10px}
</style>
</head>
<body>
<div id="timers" aria-live="polite"></div>
<main id="app"></main>
<nav id="tabs" aria-label="Navigation">

  <a href="#courses" id="tab-c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6.2"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg><span>Menu &amp; courses<span id="tab-badge"></span></span></a>
</nav>
<div id="cook" hidden></div>
<div id="toast" role="status"></div>

<script>
"use strict";
/* ================= Données ================= */
const RAYONS=[["viande","Boucherie & volaille"],["legumes","Fruits & légumes"],["frais","Crèmerie & frais"],["surgeles","Surgelés"],["epicerie","Épicerie"],["epices","Épices & condiments"],["boissons","Vins"],["autre","Autre"]];
const RAY=Object.fromEntries(RAYONS);
const UNITS=["g","cl","pc","gousse","cm","botte","boite","cas","cac","selon"];

const CAT_EMBED={
 epaule_porc:{n:"Épaule de porc en cubes",sh:"porc",r:"viande",u:"g",dlc:3},
 cuisse_poulet:{n:"Cuisses de poulet entières",s:"Cuisse de poulet entière",sh:"cuisses de poulet",r:"viande",u:"pc",rd:"ceil",dlc:3},
 haut_cuisse:{n:"Hauts de cuisse de poulet désossés",sh:"poulet",r:"viande",u:"g",dlc:3},
 paleron:{n:"Paleron ou macreuse de bœuf en cubes",sh:"bœuf",r:"viande",u:"g",dlc:3},
 boeuf_hache:{n:"Bœuf haché (15 % MG)",sh:"viande hachée",r:"viande",u:"g",dlc:2},
 dinde:{n:"Sauté de dinde en cubes",sh:"dinde",r:"viande",u:"g",dlc:3},
 saucisse:{n:"Saucisses fumées (Montbéliard) ou de Toulouse",s:"Saucisse fumée ou de Toulouse",sh:"saucisses",r:"viande",u:"pc",rd:"ceil",dlc:6},
 lardons:{n:"Lardons fumés",sh:"lardons",r:"frais",u:"g",a:{t:200,l:"barquette de 200 g"}},
 oignon:{n:"Oignons jaunes",s:"Oignon jaune",sh:"oignons",r:"legumes",u:"pc",rd:"half"},
 ail:{n:"Ail",sh:"ail",r:"legumes",u:"gousse",rd:"ceil",a:{t:10,l:"tête d'ail (~10 gousses)"}},
 gingembre:{n:"Gingembre frais",sh:"gingembre",r:"legumes",u:"cm",rd:"ceil",a:{t:10,l:"racine (~10 cm)"}},
 poivron:{n:"Poivrons (rouges et verts)",s:"Poivron",sh:"poivrons",r:"legumes",u:"pc",rd:"half"},
 carotte:{n:"Carottes",s:"Carotte",sh:"carottes",r:"legumes",u:"pc",rd:"ceil"},
 poireau:{n:"Poireaux",s:"Poireau",sh:"poireaux",r:"legumes",u:"pc",rd:"ceil"},
 citron:{n:"Citrons",s:"Citron",sh:"citron",r:"legumes",u:"pc",rd:"half"},
 persil:{n:"Persil plat",sh:"persil",r:"legumes",u:"botte",rd:"half",a:{t:1,l:"botte"}},
 tomates:{n:"Tomates concassées en boîte",sh:"tomates",r:"epicerie",u:"g",a:{t:400,l:"boîte de 400 g"}},
 passata:{n:"Coulis de tomate (passata)",sh:"coulis",r:"epicerie",u:"g",a:{t:700,l:"bouteille de 700 g"}},
 haricots:{n:"Haricots rouges en boîte (400 g)",sh:"haricots rouges",r:"epicerie",u:"boite",rd:"round",a:{t:1,l:"boîte de 400 g"}},
 coco:{n:"Lait de coco",sh:"lait de coco",r:"epicerie",u:"cl",a:{t:40,l:"boîte de 40 cl"}},
 lentilles:{n:"Lentilles corail",sh:"lentilles corail",r:"epicerie",u:"g",a:{t:500,l:"sachet de 500 g"}},

const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fr(x){
  const w=Math.floor(x+1e-9), f=x-w;
  if(Math.abs(f-0.5)<0.01) return (w?w+" ":"")+"½";
  if(Math.abs(f-0.25)<0.01) return (w?w+" ":"")+"¼";
  if(Math.abs(f-0.75)<0.01) return (w?w+" ":"")+"¾";
  return String(Math.round(x*10)/10).replace(".",",");
}
function getIng(line){
  const b=CAT[line.k]||{}; const m=Object.assign({},b);
  ["n","s","sh","r","u","rd","dlc"].forEach(f=>{if(line[f]!=null&&line[f]!=="") m[f]=line[f];});
  if(line.a) m.a=line.a;
  if(!m.n) return null;
  m.r=RAY[m.r]?m.r:"autre"; m.u=UNITS.includes(m.u)?m.u:"pc"; m.k=line.k;
  return m;
}
function roundQ(q,ing){
  const u=ing.u;
  if(u==="g") return q<20?Math.max(1,Math.round(q)):Math.round(q/5)*5;
  if(u==="cl") return q<10?Math.max(1,Math.round(q)):Math.round(q/5)*5;
  if(u==="cas"||u==="cac") return Math.max(0.5,Math.round(q*2)/2);
  if(ing.rd==="ceil") return Math.max(1,Math.ceil(q-0.05));
  if(ing.rd==="half") return Math.max(0.5,Math.round(q*2)/2);
  return Math.max(1,Math.round(q));
}
function fmtG(r){return r>=1000? fr(Math.round(r/100)/10)+" kg" : r+" g";}
function fmtQ(q,ing){
  if(ing.u==="selon"||q==null) return "au goût";
  const r=roundQ(q,ing);
  switch(ing.u){
    case "g": return fmtG(r);
    case "cl": return r>=100? fr(Math.round(r/10)/10)+" L" : r+" cl";
    case "cac": { if(r>=3){const s=r/3; if(Math.abs(s*2-Math.round(s*2))<0.01) return fr(s)+" c. à s.";} return fr(r)+" c. à c."; }
    case "cas": return fr(r)+" c. à s.";
    case "gousse": return r+(r>1?" gousses":" gousse");
    case "cm": return r+" cm";
    case "botte": return fr(r)+(r>1?" bottes":" botte");
    case "boite": return r+(r>1?" boîtes":" boîte");
    default: return fr(r);
  }
}
function ingName(ing,q){ if(ing.u==="pc"&&ing.s&&q!=null&&roundQ(q,ing)<=1) return ing.s; return ing.n; }
const dur=m=>m>=60? Math.floor(m/60)+" h"+(m%60?" "+String(m%60).padStart(2,"0"):"") : m+" min";
const eur=b=>"€".repeat(Math.max(1,Math.min(3,b||1)));

function totalMeals(){ return st.mode==="repas"? st.n : st.mode==="jours"? st.n*st.rpj : st.n*7*st.rpj; }

const isSide=r=>!!r&&(r.tags||[]).includes("accompagnement");
function computePlan(){
  const Pe=P(), rpj=st.mode==="repas"?1:st.rpj;
  const all=Object.entries(st.sel).filter(([id,m])=>R[id]&&m>0);
  const sel=all.filter(([id])=>!isSide(R[id]));
  const sides=all.filter(([id])=>isSide(R[id])).map(([id,m])=>({id,meals:m,portions:Pe*m}));
  const per=sel.map(([id,m])=>{const out=[];let rem=m;while(rem>0){const k=Math.min(st.batch,rem);out.push(k);rem-=k;}return {id,chunks:out};});
  per.sort((a,b)=>(R[a.id].fr||3)-(R[b.id].fr||3));
  const sessions=[]; let round=0, any=true;
  while(any){ any=false; per.forEach(p=>{ if(p.chunks[round]!=null){ any=true; sessions.push({id:p.id,meals:p.chunks[round]}); } }); round++; }
  let idx=0;
  sessions.forEach(s=>{ s.start=idx; s.day=Math.floor(idx/rpj)+1; s.slot=rpj===2?(idx%2?"soir":"midi"):""; idx+=s.meals; s.endDay=Math.floor((idx-1)/rpj)+1; s.portions=Pe*s.meals; });
  const items={};
  const add=(ing,q,rid,frz)=>{
    if(!ing||ing.nb) return;
    const key=ing.k;
    if(!items[key]) items[key]={ing,need:0,recs:new Set(),freeze:0,selon:ing.u==="selon"};
    if(q!=null) items[key].need+=q;
    items[key].recs.add(rid);
    if(frz&&q) items[key].freeze+=q;
  };
  sessions.forEach(s=>{
    const r=R[s.id], f=s.portions/(r.base||6);
    s.freeze=false;
    r.ings.forEach(line=>{
      const ing=getIng(line); if(!ing) return;
      const frz= ing.r==="viande" && s.day>(ing.dlc||3);
      if(frz) s.freeze=true;
      add(ing, line.q==null?null:line.q*f, r.id, frz);
    });
    if(st.accomp&&r.acc&&ACC[r.acc]){ const a=ACC[r.acc]; add(getIng({k:a.k}), s.portions*a.g, r.id, false); }
  });
  sides.forEach(sd=>{ const r=R[sd.id], f=sd.portions/(r.base||6);
    r.ings.forEach(line=>{ const ing=getIng(line); if(ing) add(ing, line.q==null?null:line.q*f, r.id, false); }); });
  return {sessions,sides,items:Object.values(items),covered:idx,T:totalMeals(),Pe};
}
function buyOf(it){
  const ing=it.ing, q=it.need;
  if(it.selon) return {txt:"au goût"};
  if(ing.a&&ing.a.t>0){
    const n=Math.max(1,Math.ceil(q/ing.a.t-0.08));
    const rest=n*ing.a.t-q;
    return {txt:n+" × "+ing.a.l, need:fmtQ(q,ing), rest: rest>ing.a.t*0.12? fmtQ(rest,Object.assign({},ing,{rd:"round"})) : ""};
  }
  if(ing.u==="g"){ const r=q<200?Math.ceil(q/10)*10:Math.ceil(q/50)*50; return {txt:fmtG(r)}; }
  if(ing.u==="pc"){ const r=Math.max(1,Math.ceil(q-0.15)); return {txt:String(r)}; }
  return {txt:fmtQ(q,ing)};
}
const eurF=v=>v.toFixed(2).replace(".",",")+" €";
function unitPrice(ing){ if(!ing||ing.p==null) return null; if(ing.a&&ing.a.t>0) return ing.p/ing.a.t; if(ing.u==="g") return ing.p/1000; return ing.p; }
function itemCost(it){
  const ing=it.ing; if(ing.p==null||it.selon) return null;
  const q=it.need;
  if(ing.a&&ing.a.t>0) return Math.max(1,Math.ceil(q/ing.a.t-0.08))*ing.p;
  if(ing.u==="g"){ const r=q<200?Math.ceil(q/10)*10:Math.ceil(q/50)*50; return r/1000*ing.p; }
  if(ing.u==="pc") return Math.max(1,Math.ceil(q-0.15))*ing.p;
  return q*ing.p;
}
function recipeCost(r){
  let tot=0;
  r.ings.forEach(l=>{ const ing=getIng(l); if(!ing||l.q==null) return; const up=unitPrice(ing); if(up!=null) tot+=l.q*up; });
  if(r.acc&&ACC[r.acc]){ const ai=getIng({k:ACC[r.acc].k}); const up=unitPrice(ai); if(up!=null) tot+=r.base*ACC[r.acc].g*up; }
  return tot/(r.base||6);
}
function costSummary(p){
  let tot=0, none=0;
  p.items.forEach(it=>{ if(st.stock[it.ing.k]||it.selon) return; const c=itemCost(it); if(c==null) none++; else tot+=c; });
  const portions=p.sessions.reduce((a,s)=>a+s.portions,0);
  return {tot,none,per:portions?tot/portions:0};
}
function listText(p){
  const cs=costSummary(p);
  const lines=["Liste de courses : "+p.covered+" repas, "+fr(p.Pe)+" portions par repas","Estimation Lidl : environ "+eurF(cs.tot)+" (hors épices et placard)",""];
  RAYONS.forEach(([rk,rl])=>{
    const its=p.items.filter(it=>it.ing.r===rk&&!st.stock[it.ing.k]&&!st.coches[it.ing.k]).sort((a,b)=>a.ing.n.localeCompare(b.ing.n,"fr"));
    if(!its.length) return;
    lines.push(rl.toUpperCase());
    its.forEach(it=>lines.push("- "+it.ing.n+" : "+buyOf(it).txt));
    lines.push("");
  });
  return lines.join("\n").trim();
}

const norm=t=>String(t||"").toLowerCase().replace(/œ/g,"oe").replace(/æ/g,"ae").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function prepNote(r){
  const t=(r&&r.etapes&&r.etapes[0]&&r.etapes[0].t)||"";

  return "";
}
function matches(m){
  const r=R[curId(m.id)], vs=[m].concat(m.alt?[R[m.alt]]:[]);
  if(filt.tag!=="tout"){ if(filt.tag==="rapide"){ if((r.prep+r.cuisson)>60) return false; } else if(filt.tag==="express"){ if((r.prep+r.cuisson)>30) return false; } else if(!vs.some(v=>(v.tags||[]).includes(filt.tag))) return false; }

  return q.split(/\s+/).every(w=>hay.includes(w));
}

  });
  if(stocked.length) h+=`<details class="stock"><summary>Toujours chez toi (${stocked.length}), retirés de la liste</summary><ul class="items">${stocked.map(it=>`<li class="item"><span></span><span class="nm">${esc(it.ing.n)}</span><span class="pr"></span><div class="sub"><b class="bq mut">${esc(buyOf(it).txt)}</b><button type="button" class="have" data-act="stock" data-id="${esc(it.ing.k)}">Remettre dans la liste</button></div></li>`).join("")}</ul></details>`;
  h+=`</section>`;

/* ================= Minuteurs ================= */
let timers=[], actx=null;
const tEl=document.getElementById("timers");
function startTimer(label,min){
  try{ if(!actx){const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A();} if(actx&&actx.resume) actx.resume().catch(()=>{}); }catch(e){}
  const tm={id:Math.random().toString(36).slice(2),label,end:Date.now()+min*60000,done:false};
  timers.push(tm); try{ window.Native&&Native.scheduleTimer(tm); }catch(e){}
  renderTimers(); toast("Minuteur lancé : "+dur(min));
}
function renderTimers(){
  const th=timers.map(t=>{const left=Math.max(0,Math.round((t.end-Date.now())/1000));const mm=Math.floor(left/60),ss=String(left%60).padStart(2,"0");
    return `<div class="timer ${t.done?"done":""}"><b>${t.done?"Fini":mm+":"+ss}</b><span>${esc(t.label)}</span><button type="button" data-act="tstop" data-id="${t.id}" aria-label="Arrêter le minuteur">✕</button></div>`;}).join("");
  tEl.innerHTML=th; const ck=document.getElementById("ck-timers"); if(ck) ck.innerHTML=th;
}
function ring(label){
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300]);}catch(e){}
  try{ if(actx){ for(let i=0;i<4;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*0.45;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.35,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);o.start(t0);o.stop(t0+0.37);} } }catch(e){}
  toast("⏰ "+label+" : c'est prêt");
}
setInterval(()=>{ if(!timers.length) return; timers.forEach(t=>{ if(!t.done&&Date.now()>=t.end){t.done=true;ring(t.label);} }); renderTimers(); },1000);
tEl.addEventListener("click",e=>{const b=e.target.closest("[data-act=tstop]"); if(b){ try{ window.Native&&Native.cancelTimer(b.dataset.id); }catch(e){} timers=timers.filter(t=>t.id!==b.dataset.id);renderTimers();}});

/* ================= Interactions ================= */
function handle(e){
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, id=b.dataset.id, d=Number(b.dataset.d||0), fld=b.dataset.f;
  const lims={adultes:[1,12],enfants:[0,10],n:[1,st.mode==="semaines"?8:st.mode==="jours"?31:60],batch:[1,3]};
  switch(act){
    case "tag": filt.tag=id; app.querySelectorAll(".chip").forEach(c=>{ const o=c.dataset.id===id; c.classList.toggle("on",o); c.setAttribute("aria-pressed",o); }); renderGrid(); return;
    case "settings": { const auto=!selIds().length; settingsOpen=!(settingsOpen==null?auto:settingsOpen); render(); return; }
    case "tstop": timers=timers.filter(t=>t.id!==id); renderTimers(); return;
    case "sel": {
      const m=R[mainOf(id)]; if(!m) return;
      const vl=m.alt?(st.ver[m.id]==="auth"?" (version authentique)":" (version simplifiée)"):"";
      if(selOf(m.id)!=null){ delete st.sel[m.id]; if(m.alt) delete st.sel[m.alt]; toast("Retiré du menu"); }
      else { const c=curId(m.id);
        if(isSide(R[c])){ st.sel[c]=Math.min(st.batch,Math.max(1,totalMeals())); toast("Accompagnement ajouté au menu"+vl); }
        else { const p=computePlan(); const left=p.T-p.covered; st.sel[c]=left>0?Math.min(st.batch,left):st.batch; toast("Ajouté au menu"+vl); } }
      save(); render(); return; }
    case "ver": {
      const m=R[id]; if(!m||!m.alt) return;
      const auth=fld==="auth"; if(auth===(st.ver[id]==="auth")) return;
      if(auth) st.ver[id]="auth"; else delete st.ver[id];
      const to=auth?m.alt:m.id, from=auth?m.id:m.alt;
      if(st.sel[from]!=null){ st.sel[to]=Math.max(st.sel[to]||0,st.sel[from]); delete st.sel[from]; toast("Menu et liste de courses : version "+(auth?"authentique":"simplifiée")); }
      if(st.portions[from]!=null&&st.portions[to]==null) st.portions[to]=st.portions[from];
      save(); try{ history.replaceState(null,"","#r-"+to); }catch(e){ location.replace("#r-"+to); } render(); return; }
    case "por": { const r=R[id]; const v=(st.portions[id]||r.base)+d*0.5; st.portions[id]=Math.max(0.5,Math.min(30,Math.round(v*2)/2)); save(); render(); return; }
    case "got": { ingGot[id]=ingGot[id]||{}; ingGot[id][fld]=!ingGot[id][fld]; render(); return; }
    case "inc": { const [a,z]=lims[fld]; st[fld]=Math.max(a,Math.min(z,st[fld]+d)); save(); render(); return; }
    case "mode": { st.mode=id; const z=id==="semaines"?8:id==="jours"?31:60; if(id==="semaines"&&st.n>4) st.n=1; if(id==="repas"&&st.n<3) st.n=6; st.n=Math.min(st.n,z); save(); render(); return; }
    case "rpj": st.rpj=Number(id); save(); render(); return;
    case "accomp": st.accomp=!st.accomp; save(); render(); return;
    case "meal": st.sel[id]=Math.max(0,Math.min(30,(st.sel[id]||0)+d)); save(); render(); return;
    case "spread": {
      const ids=selIds().filter(i=>!isSide(R[i])).sort((a,b)=>(R[a].fr||3)-(R[b].fr||3));
      const T=totalMeals(), k=ids.length; if(!k) return; const base=Math.floor(T/k); let rem=T-base*k;
      ids.forEach(i=>{st.sel[i]=base+(rem>0?1:0); if(rem>0) rem--;});
      save(); render(); toast(T+" repas répartis sur "+k+" plats"); return; }
    case "clearmenu":
      if(!confirmClear){ confirmClear=true; render(); clearTimeout(clearT); clearT=setTimeout(()=>{ if(confirmClear){ confirmClear=false; if(route().v==="courses") render(); } },6000); return; }
      confirmClear=false; clearTimeout(clearT); st.sel={}; st.coches={}; save(); render(); toast("Menu vidé"); return;
    case "cancelclear": confirmClear=false; clearTimeout(clearT); render(); return;
    case "chk": if(st.coches[id]) delete st.coches[id]; else st.coches[id]=true; save(); render(); return;
    case "uncheck": st.coches={}; save(); render(); return;
    case "stock": if(st.stock[id]) delete st.stock[id]; else { st.stock[id]=true; delete st.coches[id]; } save(); render(); return;
    case "copy": {
      const txt=listText(computePlan());
      const fallback=()=>{const box=document.getElementById("copybox"); if(box){box.innerHTML=`<p class="small mut" style="margin:0 0 6px">Copie automatique refusée : sélectionne le texte ci-dessous.</p><textarea class="copy" readonly>${esc(txt)}</textarea>`; const ta=box.querySelector("textarea"); ta.focus(); ta.select();}};
      try{ navigator.clipboard.writeText(txt).then(()=>toast("Liste copiée, colle-la où tu veux"),fallback); }catch(err){ fallback(); }
      return; }
    case "sheet": fetchSheet(true); return;
    case "update": {
      if(!(window.Native&&Native.checkUpdate)){ toast("Vérification indisponible"); return; }
      toast("Recherche d'une mise à jour…");
      Native.checkUpdate().then(r=>{ if(r==="uptodate") toast("L'app est à jour (version "+CFG.version+")"); else if(r==="error") toast("Impossible de joindre GitHub. Réessaie avec du réseau."); });
      return; }
    case "cook": openCook(id); return;
    case "cookclose": closeCook(); return;
    case "cknext": cook.i++; renderCook(); return;
    case "ckprev": cook.i=Math.max(0,cook.i-1); renderCook(); return;
    case "timer": { const r=R[id]; const e2=r&&r.etapes[Number(fld)]; if(e2&&e2.min) startTimer("Étape "+(Number(fld)+1)+" · "+shortTitle(r.titre),e2.min); return; }
  }
}
app.addEventListener("click",handle);
cookEl.addEventListener("click",handle);
cookEl.addEventListener("click",e=>{const b=e.target.closest("[data-act=tstop]"); if(b){ try{ window.Native&&Native.cancelTimer(b.dataset.id); }catch(e){} timers=timers.filter(t=>t.id!==b.dataset.id);renderTimers();}});
app.addEventListener("input",e=>{ if(e.target.id==="q"){ filt.q=e.target.value; renderGrid(); } });
app.addEventListener("change",e=>{ if(e.target.id==="tri"){ filt.sort=e.target.value; renderGrid(); } });
let lastView=route().v, listY=0;
window.addEventListener("scroll",()=>{ if(lastView==="liste") listY=window.scrollY; },{passive:true});
window.addEventListener("hashchange",()=>{ const v=route().v, back=v==="liste"&&lastView!=="liste"; lastView=v; render(); window.scrollTo(0,back?listY:0); });

rebuild(); render();
window.AppHooks={ isCookOpen:()=>!!cook, closeCook:()=>closeCook(), toast:t=>toast(t) };

/* ================= Données synchronisées ================= */
function str(v){return typeof v==="string"?v:"";}
function num(v,d){return typeof v==="number"&&isFinite(v)?v:d;}
function cleanRecipe(id,d){
  if(!/^[a-z0-9-]{2,60}$/.test(id)) return null;
  if(!d||typeof d.titre!=="string"||!Array.isArray(d.ings)||!Array.isArray(d.etapes)) return null;
  const ings=d.ings.filter(l=>l&&typeof l.k==="string"&&/^[a-z0-9_]{1,40}$/.test(l.k)).map(l=>{
    const o={k:l.k,q:typeof l.q==="number"&&isFinite(l.q)?l.q:null,no:str(l.no)};
    ["n","s","sh"].forEach(f=>{if(str(l[f])) o[f]=str(l[f]);});
    if(RAY[l.r]) o.r=l.r; if(UNITS.includes(l.u)) o.u=l.u; if(["ceil","half","round"].includes(l.rd)) o.rd=l.rd;
    if(typeof l.dlc==="number") o.dlc=l.dlc;
    if(l.a&&typeof l.a.t==="number"&&l.a.t>0&&typeof l.a.l==="string") o.a={t:l.a.t,l:l.a.l};
    return o;}).filter(l=>getIng(l));
  const etapes=d.etapes.map(e=>typeof e==="string"?{t:e}:{t:str(e&&e.t),min:num(e&&e.min,0)}).filter(e=>e.t);
  if(!ings.length||!etapes.length) return null;
  return {id,titre:d.titre.slice(0,120),desc:str(d.desc).slice(0,240),base:Math.max(1,num(d.base,6)),prep:num(d.prep,0),cuisson:num(d.cuisson,0),budget:num(d.budget,1),frigo:num(d.frigo,3),congel:str(d.congel)||"Oui",
    tags:Array.isArray(d.tags)?d.tags.filter(t=>typeof t==="string"):[],acc:ACC[d.acc]?d.acc:null,fr:num(d.fr,3),hue:num(d.hue,210),astuce:str(d.astuce),ings,etapes,
    parent:typeof d.parent==="string"?d.parent.trim():undefined,pays:str(d.pays).trim().slice(0,40)};
}
/* ================= Lecture du Google Sheet ================= */
const toNum=v=>{ if(v==null) return null; const t=String(v).replace(/[^0-9,.\-]/g,"").replace(",","."); if(t==="") return null; const n=Number(t); return isFinite(n)?n:null; };
function rowsToObjs(rows){
  if(!Array.isArray(rows)||!rows.length) return [];
  const h=rows[0].map(c=>String(c==null?"":c).trim());
  return rows.slice(1).filter(r=>Array.isArray(r)&&r.some(c=>String(c==null?"":c).trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,String(r[i]==null?"":r[i]).trim()])));
}
function buildFromSheet(raw){
  const cat={};
  rowsToObjs(raw.cat).forEach(o=>{
    if(!/^[a-z0-9_]{1,40}$/.test(o.cle||"")||!o.nom) return;
    const c={n:o.nom,r:RAY[o.rayon]?o.rayon:"autre",u:UNITS.includes(o.unite)?o.unite:"pc"};
    if(o.nom_singulier) c.s=o.nom_singulier; if(o.nom_court) c.sh=o.nom_court;
    if(["ceil","half","round"].includes(o.arrondi)) c.rd=o.arrondi;
    const d=toNum(o.conservation_jours); if(d) c.dlc=d;
    const t=toNum(o.conditionnement_taille); if(t&&o.conditionnement_libelle) c.a={t,l:o.conditionnement_libelle};
    if(/^oui$/i.test(o.non_achete||"")) c.nb=true;
    const pr=toNum(o.prix_lidl_eur); if(pr!=null&&pr>0) c.p=pr;
    cat[o.cle]=c;
  });
  if(!Object.keys(cat).length) return null;
  const ings={}, etas={};
  rowsToObjs(raw.ing).forEach(o=>{ if(!o.recette_id||!o.ingredient_cle) return; (ings[o.recette_id]=ings[o.recette_id]||[]).push({ord:toNum(o.ordre)||0,k:o.ingredient_cle,q:toNum(o.quantite),no:o.note||""}); });
  rowsToObjs(raw.eta).forEach(o=>{ if(!o.recette_id||!o.texte) return; (etas[o.recette_id]=etas[o.recette_id]||[]).push({ord:toNum(o.numero)||0,t:o.texte,min:toNum(o.minuteur_min)||0}); });
  const prevCat=CAT; CAT=cat;
  const recs=[];
  rowsToObjs(raw.rec).forEach(o=>{
    const nz=v=>{const n=toNum(v);return n==null?undefined:n;};
    const r=cleanRecipe(o.id||"",{titre:o.titre,desc:o.description,base:nz(o.portions_base),prep:nz(o.prepa_min),cuisson:nz(o.cuisson_min),budget:nz(o.budget_1a3),frigo:nz(o.frigo_jours),congel:o.congelation,
      tags:(o.tags||"").split(",").map(x=>x.trim()).filter(Boolean),acc:o.accompagnement,fr:nz(o.ordre_fraicheur),hue:nz(o.couleur),astuce:o.astuce,parent:o.variante_de,pays:o.pays,
      ings:(ings[o.id]||[]).sort((a,b)=>a.ord-b.ord).map(({k,q,no})=>({k,q,no})),
      etapes:(etas[o.id]||[]).sort((a,b)=>a.ord-b.ord).map(({t,min})=>({t,min}))});
    if(r) recs.push(r);
  });
  if(!recs.length){ CAT=prevCat; return null; }
  return recs;
}
function applySheet(raw,at){
  const recs=buildFromSheet(raw);
  if(!recs){ sheetState={status:"err",code:"empty",at:0}; return false; }
  SHEET_RECS=recs; sheetState.at=at||Date.now(); rebuild(); return true;
}
function dropSheet(){ SHEET_RECS=null; CAT=CAT_EMBED; try{localStorage.removeItem(SRC_LS)}catch(e){} rebuild(); }
function valuesOf(p){
  if(typeof p==="string"){ try{p=JSON.parse(p);}catch(e){return null;} }
  if(p&&Array.isArray(p.values)) return p.values;
  if(p&&typeof p==="object"&&p.range&&!p.values) return [];
  return null;
}
function hhmm(t){ const d=new Date(t); return String(d.getHours()).padStart(2,"0")+"h"+String(d.getMinutes()).padStart(2,"0"); }
function srcHTML(){
  const s=sheetState, open=`<a class="btn ghost" href="${SHEET_URL}" target="_blank" rel="noopener">Ouvrir le Sheet</a>`;
  const again=label=>`<button type="button" class="btn" data-act="sheet">${label}</button>`;
  if(s.status==="ok") return `<p class="src ok"><span class="dot"></span><span>Lu dans Google Sheets à ${hhmm(s.at)} ${again("Actualiser")} ${open}</span></p>`;
  if(s.status==="loading") return `<p class="src"><span class="dot"></span><span>${SHEET_RECS?"Copie du "+hhmm(s.at)+" affichée, lecture du Google Sheet…":"Lecture du Google Sheet…"}</span></p>`;
  const msg={
    noconfig:"L'adresse du Sheet n'est pas configurée dans cette version de l'app.",
    offline:"Pas de réseau.",
    forbidden:"Le script du Sheet refuse la clé de l'app. Vérifie la clé dans le script Apps Script.",
    badjson:"Le script du Sheet a répondu quelque chose d'inattendu. Vérifie qu'il est déployé en « Application Web », accès « Tout le monde ».",
    tool_error:"Google n'a pas pu lire le Sheet. Vérifie que les onglets Recettes, Ingrédients, Étapes et Catalogue existent toujours.",
    empty:"Le Sheet ne contient aucune recette complète (il faut au moins un ingrédient et une étape par recette)."
  }[s.code]||"Le Sheet ne répond pas pour l'instant.";
  return `<p class="src err"><span class="dot"></span><span>${esc(msg)} ${SHEET_RECS?"Dernière copie du "+hhmm(s.at)+" affichée.":"Copie intégrée affichée."} ${again("Réessayer")}</span></p>`;
}
function rerender(){
  if(cook){ renderCook(); return; }
  if(route().v!=="liste"){ render(); return; }
  const box=document.getElementById("src");
  if(!box){ renderListe(); return; }
  box.innerHTML=srcHTML(); const n=document.getElementById("nrec"); if(n) n.textContent=ORDER.length+" recettes · sans four"; renderGrid();
}
let fetching=false;
async function fetchSheet(refresh){
  if(!CFG.api||!CFG.key){ sheetState={status:"err",code:"noconfig",at:sheetState.at}; rerender(); return; }
  if(fetching) return; fetching=true;
  sheetState={status:"loading",code:"",at:sheetState.at}; rerender();
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),20000);
    let res;
    try{ res=await fetch(CFG.api+(CFG.api.includes("?")?"&":"?")+"k="+encodeURIComponent(CFG.key)+"&t="+Date.now(),{signal:ctl.signal,cache:"no-store",redirect:"follow"}); }
    finally{ clearTimeout(to); }
    let data; try{ data=await res.json(); }catch(e){ throw {code:"badjson"}; }
    if(data&&data.error) throw {code:data.error==="forbidden"?"forbidden":"tool_error"};
    if(!data||!Array.isArray(data.rec)) throw {code:"badjson"};
    const raw={rec:data.rec,ing:data.ing||[],eta:data.eta||[],cat:data.cat||[]};
    const at=Date.now();
    if(applySheet(raw,at)){ sheetState={status:"ok",code:"",at}; try{localStorage.setItem(SRC_LS,JSON.stringify({raw,at}))}catch(e){} }
  }catch(e){
    const code=(e&&e.code)||(navigator.onLine===false?"offline":"upstream_error");
    sheetState={status:"err",code,at:sheetState.at};
  }
  fetching=false; rerender();
}
try{ const c=JSON.parse(localStorage.getItem(SRC_LS)||"null"); if(c&&c.raw&&applySheet(c.raw,c.at)) render(); }catch(e){}
fetchSheet(false);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&Date.now()-(sheetState.at||0)>10*60000) fetchSheet(false); });
</script>
